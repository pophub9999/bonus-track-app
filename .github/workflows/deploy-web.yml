name: Deploy web preview

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'index.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy web to EAS Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export Expo web
        run: npm run export:web

      - name: Deploy production web
        env:
          CI: '1'
        run: eas deploy --prod --non-interactive --dev-domain bonus-track-pophub9999
