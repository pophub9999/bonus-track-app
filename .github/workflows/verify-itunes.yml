name: Verify iTunes catalogue
on:
  push:
    branches: [codex/vps-public-library]
    paths: ['App.js', 'backend/**', '.github/workflows/verify-itunes.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run export:web
      - working-directory: backend
        run: npm ci && npm run build
      - working-directory: backend
        run: node --check server.mjs && node --test tests/music-search.test.mjs
        env:
          LIVE_ITUNES: '1'
